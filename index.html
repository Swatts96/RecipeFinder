<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Search Application</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Recipe Finder</h1>
        <p>Discover Recipes Based on Ingredients You Have</p>
        <nav class="navbar">
            <div class="nav-brand"><h1>Recipe Finder</h1></div>
            <div class="nav-menu">
                <a href="index.html" class="nav-link">Home</a>
                <a href="saved-recipes.html" class="nav-link">Saved Recipes</a>
                <a href="search-history.html" class="nav-link">Search History</a>
                <a href="browse-recipes.html" class="nav-link">Free Recipe Browsing</a>
            </div>
            <div class="nav-user">
                <button id="login-button" class="nav-button">Login</button>
                <button id="register-button" class="nav-button">Register</button>
            </div>
        </nav>
    </header>
    <main>
        <section id="ingredient-section">
            <h2>What's in your fridge?</h2>
            <textarea id="ingredients-input" placeholder="Enter ingredients you have, separated by commas..."></textarea>
            <button id="find-recipes-button">Find Recipes</button>
        </section>

        <section id="filters-section">
            <fieldset>
                <legend>Filter by dietary preference:</legend>
                <label for="vegetarian">
                    <input type="checkbox" id="vegetarian" name="diet" value="vegetarian">
                    Vegetarian
                </label>
                <label for="vegan">
                    <input type="checkbox" id="vegan" name="diet" value="vegan">
                    Vegan
                </label>
                <label for="gluten-free">
                    <input type="checkbox" id="gluten-free" name="diet" value="gluten-free">
                    Gluten-Free
                </label>
                <label for="ketogenic">
                    <input type="checkbox" id="ketogenic" name="diet" value="ketogenic">
                    Ketogenic
                </label>
                <label for="paleo">
                    <input type="checkbox" id="paleo" name="diet" value="paleo">
                    Paleo
                </label>
                <!-- Add more dietary options here -->
            </fieldset>
        </section>

        <section id="results-section">
            <!-- Results will be populated here -->
        </section>

        <section id="favorites-section">
            <h2>Favorite Recipes</h2>
            <!-- Users can save favorite recipes here -->
        </section>

        <section id="shopping-list-section">
            <h2>Shopping List</h2>
            <!-- Shopping list items will be added here -->
        </section>
    </main>
    <footer>
        <p>&copy; 2024 Recipe Finder. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
