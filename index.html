<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeftoversIO</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">Recipe Finder</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="saved-recipes.html">Saved Recipes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="search-history.html">Search History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="browse-recipes.html">Free Recipe Browsing</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="login-button">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="register-button">Register</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="UI container">
        <div class="content-area">
            <section id="ingredient-section">
                <img src="LeftoversIO.png" alt="Logo" style="max-height: 250px;">
                <h2>What's in your fridge?</h2>
                <!-- Ingredient Selection Area -->
                <div class="tab-section">
                    <ul class="nav nav-tabs" id="ingredientTabs" role="tablist">
                        <li class="nav-item">
                            <a class="nav-link active" id="meat-tab" data-toggle="tab" href="#meat" role="tab" aria-controls="meat" aria-selected="true">Meat</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="vegetable-tab" data-toggle="tab" href="#vegetable" role="tab" aria-controls="vegetable" aria-selected="false">Vegetable</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id="other-tab" data-toggle="tab" href="#other" role="tab" aria-controls="other" aria-selected="false">Other</a>
                        </li>
                    </ul>
                    <div class="tab-content" id="ingredientTabContent">
                        <div class="tab-pane fade show active" id="meat" role="tabpanel" aria-labelledby="meat-tab">
                            <!-- Meat ingredients will be loaded here -->
                        </div>
                        <div class="tab-pane fade" id="vegetable" role="tabpanel" aria-labelledby="vegetable-tab">
                            <!-- Vegetable ingredients will be loaded here -->
                        </div>
                        <div class="tab-pane fade" id="other" role="tabpanel" aria-labelledby="other-tab">
                            <!-- Other ingredients will be loaded here -->
                        </div>
                    </div>
                </div>
            
            </section>

           
        <section id="filters-section">
            <fieldset>
                <legend>Filter by dietary preference:</legend>
                <label for="vegetarian">
                    <input type="checkbox" id="vegetarian" name="diet" value="vegetarian">
                    Vegetarian
                </label>
                <label for="vegan">
                    <input type="checkbox" id="vegan" name="diet" value="vegan">
                    Vegan
                </label>
                <label for="gluten-free">
                    <input type="checkbox" id="gluten-free" name="diet" value="gluten-free">
                    Gluten-Free
                </label>
                <label for="ketogenic">
                    <input type="checkbox" id="ketogenic" name="diet" value="ketogenic">
                    Ketogenic
                </label>
                <label for="paleo">
                    <input type="checkbox" id="paleo" name="diet" value="paleo">
                    Paleo
                </label>
                <!-- Add more dietary options here -->
            </fieldset>


            <button id="find-recipes-button" class="btn btn-primary">Three Random Recipes!</button>

            <section id="results-section">
                <!-- Results will be populated here -->
            </section>

       
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
