<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeftoversIO</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="index.html">Recipe Finder</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="saved-recipes.html">Saved Recipes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="search-history.html">Search History</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="browse-recipes.html">Free Recipe Browsing</a>
                </li>
            </ul>
            <ul class="navbar-nav ml-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#" id="login-button">Login</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" id="register-button">Register</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="UI container">
        <div class="content-area">
            <section id="ingredient-section">
                <img src="LeftoversIO.png" alt="Logo" style="max-height: 250px;">
                    <h2>What's in your fridge?</h2>
                    <input type="text" id="ingredient-input" class="form-control" placeholder="Enter ingredients separated by commas (e.g., chicken, tomato, onion)">
                </section>
            </section>

           
        <section id="filters-section">
            <fieldset>
                <legend>Filter by dietary preference:</legend>
                <label for="vegetarian">
                    <input type="checkbox" id="vegetarian" name="diet" value="vegetarian">
                    Vegetarian
                </label>
                <label for="vegan">
                    <input type="checkbox" id="vegan" name="diet" value="vegan">
                    Vegan
                </label>
                <label for="gluten-free">
                    <input type="checkbox" id="gluten-free" name="diet" value="gluten-free">
                    Gluten-Free
                </label>
                <label for="ketogenic">
                    <input type="checkbox" id="ketogenic" name="diet" value="ketogenic">
                    Ketogenic
                </label>
                <label for="paleo">
                    <input type="checkbox" id="paleo" name="diet" value="paleo">
                    Paleo
                </label>
          
            </fieldset>


            <button id="find-recipes-button" class="btn btn-primary">Five Random Recipes!</button>

  
            <section id="results-section">
                
                <!-- Results will be populated here -->
            </section>

       
        </div>
    </main>

    <script src="main.js" type="module"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.5.1/gsap.min.js"></script>
</body>
</html>
